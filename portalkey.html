        .btn-kembali {

            background: rgba(25, 15, 15, 0.6);
            border: 1px solid #4a1515; border-radius: 16px;
            padding: 14px; color: #ffffff;
            text-decoration: none; font-size: 14px; font-weight: 600;
            margin-bottom: 25px;
        }
        .footer { font-size: 10px; color: #555555; letter-spacing: 0.5px; }

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const ref = document.referrer;
        const isVerified = urlParams.get('token') === 'zhx_passed_2026' || ref.includes('bicosafe.com');

        if (isVerified) {
            document.getElementById('mainCard').style.display = 'block';
        } else {
            document.getElementById('blockCard').style.display = 'block';
        }

        function copyKey() {
            const keyText = document.getElementById('keyText').innerText;
            navigator.clipboard.writeText(keyText).then(() => {
                const btn = document.querySelector('.btn-salin');
                btn.innerText = 'Key Berhasil Disalin!';
                btn.style.background = '#00cc66';
                setTimeout(() => {
                    btn.innerText = 'COPY KEY';
                    btn.style.background = 'linear-gradient(180deg, #e62e2e 0%, #b31b1b 100%)';
                }, 2000);
            });
        }
    </script>
