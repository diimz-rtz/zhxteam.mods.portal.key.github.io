<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZHX TEAM - Control Center</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: #030303;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 50%, #200404 0%, #030303 80%);
            padding: 20px 10px;
        }
        .card {
            background: rgba(15, 12, 12, 0.95);
            padding: 35px 20px 25px 20px;
            border-radius: 28px;
            border: 1.5px solid rgba(180, 30, 30, 0.4);
            box-shadow: 0 0 35px rgba(150, 0, 0, 0.25);
            max-width: 380px;
            width: 100%;
            text-align: center;
        }
        .logo-container {
            width: 110px; height: 110px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            border: 2px solid #ff2222;
            box-shadow: 0 0 20px rgba(230, 30, 30, 0.8);
            background: #000;
        }
        .logo-img { width: 100%; height: 100%; object-fit: cover; }
        .pill-badge {
            display: inline-block;
            border: 1px solid #752222;
            color: #e67373;
            padding: 5px 22px;
            border-radius: 20px;
            font-size: 11px; font-weight: 700;
            letter-spacing: 2px; margin-bottom: 12px;
            background: rgba(40, 10, 10, 0.5);
            text-transform: uppercase;
        }
        h1 { font-size: 26px; font-weight: 800; letter-spacing: 1px; margin-bottom: 6px; color: #ffffff; }
        .subtitle { color: #a0a0a0; font-size: 13px; margin-bottom: 30px; }
        .nav-button {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(25, 15, 15, 0.6);
            border: 1px solid #4a1515; border-radius: 16px;
            padding: 14px 18px; text-decoration: none; color: #ffffff;
            margin-bottom: 30px; transition: 0.2s ease;
        }
        .nav-button:active { background: rgba(45, 20, 20, 0.8); }
        .nav-text { text-align: left; }
        .nav-title { font-weight: 700; font-size: 16px; display: block; color: #ffffff; }
        .nav-sub { font-size: 11px; color: #888888; margin-top: 2px; display: block; }
        .arrow-btn {
            width: 36px; height: 36px;
            background: #4a1212; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            color: #ff4d4d; font-weight: bold; font-size: 16px;
        }
        .social-group { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
        .social-btn {
            width: 52px; height: 52px;
            background: rgba(30, 15, 15, 0.6);
            border: 1px solid #4a1515; border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            color: #ffffff; text-decoration: none;
        }
        .social-btn svg { width: 22px; height: 22px; fill: #ffffff; }
        .footer { font-size: 10px; color: #555555; letter-spacing: 0.5px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-container">
            <img src="zhxteamlogo.png" class="logo-img" alt="ZHX Team Logo">
        </div>

        <div class="pill-badge">CONTROL CENTER</div>
        <h1>ZHX TEAM</h1>
        <div class="subtitle">Modding & Script Management Dashboard</div>

        <a href="https://bicosafe.com/Portal-Ads" class="nav-button">
            <div class="nav-text">
                <span class="nav-title">PortarKey System</span>
                <span class="nav-sub">Akses verifikasi & tautan iklan eksternal</span>
            </div>
            <div class="arrow-btn">&rarr;</div>
        </a>

        <div class="social-group">
            <a href="https://wa.me/" class="social-btn" target="_blank">
                <svg viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448c-.63-.34-1.332-.55-2.039-.55-.38 0-.76.05-1.14.15l-4.218 1.109zm6.27-5.603c.532.316 1.141.488 1.764.489 1.696 0 3.262-.898 4.102-2.348.84-1.45.84-3.246 0-4.696-.84-1.45-2.406-2.348-4.102-2.348-1.696 0-3.262.898-4.102 2.348-.84 1.45-.84 3.246 0 4.696.315.544.757 1.011 1.282 1.365l-1.121 4.095 4.177-1.096z"/></svg>
            </a>
            <a href="https://tiktok.com/" class="social-btn" target="_blank">
                <svg viewBox="0 0 24 24"><path d="M12.53.02C13.84 0 15.14.01 16.44 0c.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.03-2.86-.31-4.12-.99-2.09-1.11-3.57-3.14-3.98-5.46-.41-2.32.22-4.78 1.73-6.55 1.51-1.77 3.8-2.77 6.13-2.69.12 0 .25.01.37.02v4.04c-.66-.12-1.35-.04-1.97.24-.76.35-1.34 1.02-1.57 1.82-.23.8-.08 1.68.4 2.35.48.67 1.25 1.07 2.08 1.08.97.02 1.92-.47 2.45-1.31.33-.52.5-1.13.5-1.75.02-3.83.01-7.66.02-11.49z"/></svg>
            </a>
        </div>

        <div class="footer">&copy; 2026 ZHX TEAM MODS OFFICIAL. All rights reserved.</div>
    </div>
</body>
</html>
